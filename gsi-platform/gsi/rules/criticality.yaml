# ═══════════════════════════════════════════════════════════════════════════
#  مقاومت قطعه و بحرانی بودن
#
#  «مقاومت» = تعداد روزی که موجودی فعلی جوابگوی مصرف است:
#        مقاومت (روز) = موجودی قابل مصرف ÷ مصرف روزانه
#
#  منبع داده: Oracle برای موجودی انبار/مصرف + سورس کارشناسان برای
#  نزد سازنده/درراه/گمرک. Missing هرگز Zero فرض نمی‌شود.
#  این لایه در نسخه ۲۰.۱ اصلاً وجود نداشت و در بازنویسی اول هم جا مانده بود.
# ═══════════════════════════════════════════════════════════════════════════
pack: criticality
version: "2.0"
updated_at: "2026-09-17"
status: internal

# ───────────────────────────────────────────────────────────────────────────
# ۱) فرمول محاسبه مقاومت
# ───────────────────────────────────────────────────────────────────────────
formula:
  # مقاومت بحرانی اصلی = (STOCK_IKCO + STOCK_SAPCO) ÷ نیاز روزانه قطعات.
  # فهرست زیر برای «پوشش کل زنجیره تأمین» و مقاومت‌های تکمیلی است؛
  # سه bucket کارشناسی شرط طبقه بحرانی اصلی نیستند و Missing آن‌ها بحرانی را UNKNOWN نمی‌کند.
  numerator_components:
    - field: STOCK_IKCO
      fa: "موجودی انبار ایران خودرو"
      source: "oracle → موجودي انبار ايران خودرو"
      enabled: true
    - field: STOCK_SAPCO
      fa: "موجودی انبار ساپکو"
      source: "oracle → موجودي انبار ساپکو"
      enabled: true
    - field: SUPPLIER_QTY
      fa: "موجودی نزد سازنده/تأمین‌کننده"
      source: "Commercial Expert Data → موجودی نزد سازنده"
      enabled: true
      status: internal_source_of_truth
    - field: IN_TRANSIT_QTY
      fa: "موجودی در راه"
      source: "Commercial Expert Data → موجودی در راه"
      enabled: true
      status: internal_source_of_truth
    - field: IN_CUSTOMS_QTY
      fa: "موجودی در گمرک"
      source: "Commercial Expert Data → موجودی گمرک"
      enabled: true
      status: internal_source_of_truth
  denominator: DAILY_NEED           # نیاز روزانه قطعات (oracle)
  unit: days

  # اگر مصرف ماهانه/سالانه داده شده باشد، با این ضرایب به روزانه تبدیل می‌شود
  consumption_conversion:
    daily: 1
    weekly: 0.142857        # ÷ ۷
    monthly: 0.033333       # ÷ ۳۰
    yearly: 0.002740        # ÷ ۳۶۵

  # سه bucket کارشناسی فقط برای مقاومت کل تأمین/دید زنجیره استفاده می‌شوند.
  include_in_transit: true
  criticality_numerator: [STOCK_IKCO, STOCK_SAPCO]
  # مقاومت انبار (فقط موجودی فیزیکی قابل مصرف) همیشه جداگانه گزارش می‌شود
  # تا تفاوت «آنچه امروز داریم» با «آنچه در راه است» دیده شود.
  always_report_warehouse_only: true

  # حالت‌های مرزی
  edge_cases:
    zero_consumption:
      value: null                 # مقاومت بی‌نهایت
      band: NO_CONSUMPTION
      fa: "نیاز روزانه صفر — قطعه راکد یا خارج از تولید"
    zero_stock:
      value: 0
      band: STOCKOUT
      fa: "موجودی صفر — توقف خط"
    missing_data:
      value: null
      band: UNKNOWN
      fa: "موجودی IKCO/SAPCO یا نیاز روزانه برای مقاومت اصلی داده ندارد — Unknown ≠ Zero"

  max_reported_days: 999          # سقف نمایش برای مقاومت‌های خیلی بزرگ

# ───────────────────────────────────────────────────────────────────────────
# ۲) طبقه‌بندی بحرانی بودن  ← درخواست صریح کاربر
#     زیر ۱۰ روز       = بحرانی
#     بین ۱۰ تا ۲۰ روز = در حال بحرانی شدن
# ───────────────────────────────────────────────────────────────────────────
# رنگ هر باند از gsi/design/tokens.py می‌آید، نه از سلیقه:
#     color  = STATUS[...].fill   رنگ نشانه و میله نمودار
#     fill   = STATUS[...].wash   زمینه سلول (متن ink روی آن می‌نشیند)
# مقادیر قبلی (C0392B / F39C12 / F1C40F / 27AE60 / 95A5A6) هم‌خانواده هیچ
# خروجی دیگری نبودند و سه‌تایشان با متن روی‌شان کف WCAG را رد می‌کردند.
# آزمون tests/test_design_system.py این دو ستون را با توکن‌ها تطبیق می‌دهد؛
# اگر اینجا دست‌کاری شود و با tokens.py نخواند، آزمون قرمز می‌شود.
bands:
  - code: STOCKOUT
    sort: 0
    max_days: 0                   # مقاومت صفر
    fa: "🔴 توقف خط (موجودی صفر)"
    short_fa: "توقف خط"
    color: "A32828"
    fill: "FBEAEA"
    action: "اقدام اضطراری — تأمین فوری یا جایگزینی قطعه"

  - code: CRITICAL
    sort: 1
    max_days: 10                  # کمتر از ۱۰ روز
    fa: "🔴 بحرانی (زیر ۱۰ روز)"
    short_fa: "بحرانی"
    color: "D03B3B"
    fill: "FDEDED"
    action: "تسریع ترخیص و حمل — پیگیری روزانه"

  - code: BECOMING_CRITICAL
    sort: 2
    max_days: 20                  # بین ۱۰ تا ۲۰ روز
    fa: "🟠 در حال بحرانی شدن (۱۰ تا ۲۰ روز)"
    short_fa: "در حال بحرانی شدن"
    color: "E07B4F"
    fill: "FDEFE8"
    action: "پیگیری هفتگی — بررسی وضعیت ترخیص و تخصیص ارز"

  - code: WATCH
    sort: 3
    max_days: 45
    fa: "🟡 تحت نظر (۲۰ تا ۴۵ روز)"
    short_fa: "تحت نظر"
    color: "E0A52E"
    fill: "FBF3E2"
    action: "پایش دوره‌ای"

  - code: SAFE
    sort: 4
    max_days: null                # بیش از ۴۵ روز
    fa: "🟢 ایمن (بیش از ۴۵ روز)"
    short_fa: "ایمن"
    color: "1D8F4E"
    fill: "E8F6EC"
    action: "بدون اقدام"

  - code: NO_CONSUMPTION
    sort: 5
    max_days: null
    fa: "⚪ بدون مصرف"
    short_fa: "بدون مصرف"
    color: "8B9AA5"
    fill: "EEF1F3"
    action: "بررسی توقف تولید یا قطعه راکد"

  - code: UNKNOWN
    sort: 6
    max_days: null
    fa: "❓ نامشخص (داده ناقص)"
    short_fa: "نامشخص"
    color: "ADB9C2"
    fill: "F1F3F5"
    action: "تکمیل موجودی IKCO/SAPCO و/یا نیاز روزانه Oracle؛ bucketهای کارشناسی جداگانه گزارش می‌شوند"

# ───────────────────────────────────────────────────────────────────────────
# ۳) مرتب‌سازی گزارش  ← «سورت بر اساس بحرانی»
# ───────────────────────────────────────────────────────────────────────────
sorting:
  enabled: true
  order:
    - field: CRITICALITY_SORT      # ابتدا طبقه بحرانی (توقف خط → ایمن)
      ascending: true
    - field: RESISTANCE_DAYS       # درون هر طبقه، کم‌مقاومت‌ترین بالاتر
      ascending: true
      na_position: last
    - field: امتیاز ریسک            # سپس ریسک بالاتر
      ascending: false
  fa: "بحرانی‌ترین قطعات همیشه در بالای هر شیت قرار می‌گیرند."

# ───────────────────────────────────────────────────────────────────────────
# ۴) اثر بر موتور ریسک
# ───────────────────────────────────────────────────────────────────────────
risk_contribution:
  # امتیاز ۰ تا ۱۰۰ که به مؤلفه part_criticality موتور ریسک داده می‌شود
  scores:
    STOCKOUT: 100
    CRITICAL: 90
    BECOMING_CRITICAL: 60
    WATCH: 30
    SAFE: 0
    NO_CONSUMPTION: 10
    UNKNOWN: 40
  fa: "قطعه بحرانی، ریسک کل پرونده را بالا می‌برد حتی اگر تعهد ارزی سالم باشد."

# ───────────────────────────────────────────────────────────────────────────
# ۵) هشدار ترکیبی بحرانی + لجستیک
#     خطرناک‌ترین حالت: قطعه بحرانی که پرونده‌اش هم بلوکه است.
# ───────────────────────────────────────────────────────────────────────────
combined_alerts:
  - when:
      criticality_in: [STOCKOUT, CRITICAL]
      is_blocked: true
    severity: CRITICAL
    fa: "قطعه بحرانی با پرونده بلوکه — ریسک قطعی توقف خط"
    action: "تشکیل جلسه فوری با بازرگانی و بانک"

  - when:
      criticality_in: [STOCKOUT, CRITICAL]
      stuck_days_gt: 10
    severity: CRITICAL
    fa: "قطعه بحرانی که محموله‌اش در گمرک رسوب کرده"
    action: "اعزام نماینده به گمرک و ترخیص فوری"

  - when:
      criticality_in: [BECOMING_CRITICAL]
      is_blocked: true
    severity: HIGH
    fa: "قطعه در حال بحرانی شدن با پرونده بلوکه"
    action: "رفع انسداد پیش از ورود به وضعیت بحرانی"

  - when:
      criticality_in: [STOCKOUT, CRITICAL]
      has_no_open_order: true
    severity: CRITICAL
    fa: "قطعه بحرانی بدون هیچ سفارش باز"
    action: "ثبت درخواست خرید اضطراری (PR) — هیچ محموله‌ای در راه نیست"
