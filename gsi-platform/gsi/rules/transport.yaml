documents:
  - code: BL
    fa: "بارنامه دریایی"
    en: "Bill of Lading"
    negotiable: true
    key_pattern: "^[A-Z]{4}[A-Z0-9]{5,}$"
    note: "چهار حرف نخست معمولاً کد SCAC خط کشتیرانی است (مثال: MSCU, MAEU, HLCU, COSU, ONEY)."
  - code: AWB
    fa: "بارنامه هوایی"
    en: "Air Waybill"
    negotiable: false
    key_pattern: "^[0-9]{3}-?[0-9]{8}$"
    note: "سه رقم نخست کد پیشوند شرکت هواپیمایی (مثال: 176 = ایران‌ایر)."
  - code: CMR
    fa: "بارنامه جاده‌ای"
    en: "CMR Consignment Note"
    negotiable: false
  - code: RWB
    fa: "بارنامه ریلی"
    en: "Rail Waybill / SMGS"
    negotiable: false
  - code: MTD
    fa: "سند حمل چندوجهی"
    en: "Multimodal Transport Document"
    negotiable: true
  - code: PI
    fa: "پیش‌فاکتور"
    en: "Proforma Invoice"
  - code: CI
    fa: "سیاهه تجاری"
    en: "Commercial Invoice"
  - code: PL
    fa: "لیست عدل‌بندی"
    en: "Packing List"
  - code: COO
    fa: "گواهی مبدأ"
    en: "Certificate of Origin"
  - code: INS
    fa: "بیمه‌نامه"
    en: "Insurance Policy"

# اعتبارسنجی شماره بارنامه — برای جلوگیری از اتصال اشتباه به شماره فنی/پروفرما
bl_validation:
  min_length: 6
  max_length: 20
  strict_pattern: "^[A-Z]{3,4}[A-Z0-9]{4,}$"
  reject_if_pure_digits_shorter_than: 9
  known_scac_prefixes:
    [MSCU, MAEU, MRKU, HLCU, HLXU, COSU, ONEY, EGLV, OOLU, CMDU, APLU,
     YMLU, KMTU, PABV, ZIMU, TGHU, GESU, TCLU, SUDU, SEAU, HDMU, WHLC]
  note: >
    در سورس مقاومت مشاهده شد که ستون «BL No.» گاهی حاوی شماره فنی سازنده یا
    شماره پروفرما است (نمونه: 541339، 2036866948، 603111/1). چنین مقادیری
    نباید به عنوان کلید بارنامه استفاده شوند و به ستون قرنطینه منتقل می‌شوند.

