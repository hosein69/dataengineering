# ═══════════════════════════════════════════════════════════════════════════
#  رجیستری سورس‌ها — نسخه ۳، منطبق بر هدرهای واقعی
#  مرجع: HEADERS_MAP_20260901 (۶۶۶ ستون از ۱۷ فایل واقعی)
#
#  تغییرات نسبت به نسخه ۲ و دلیل هرکدام:
#    clearance      شیت «Clearance Report» وجود نداشت → هر فایل شیت خودش را دارد
#    sata           شیت «SATA» → «Sata Tracking»  + این سورس حامل «ثبت سفارش» است
#    ilappend       شیت «IL Append» → «Append»
#    credit         شیت «Credit Dept» → «PURCREDIT»
#    sap            شیت «Sheet1» → «Data» و کلید اتصال از BL به PR تغییر کرد
#    oracle         شیت «Total_Report ...» — سورس موجودی و نیاز روزانه
#    moghavemat     الگو «*Commercial Expert Data*» و شیت «Expert Data»
#    missmohammadi  هیچ فایلی با این الگو وجود ندارد → غیرفعال
# ═══════════════════════════════════════════════════════════════════════════
registry_version: "3.0"
updated_at: "2026-09-01"
source_of_truth: "HEADERS_MAP_20260901_1304.xlsx"

defaults:
  extensions: [".xlsx", ".xlsm", ".xls"]
  ignore_prefix: "~$"
  pick: newest


authority:
  scope: full_report
  tiers:
    tier_1: [moghavemat, ntsw]
    tier_2: [abbasi, sata]
  fallback_rule: lower_tier_fills_blank_only
  conflict_rule: higher_tier_wins_equal_field_semantics

sources:
  abbasi:
    folder: "${BLS_TOTAL_DIR}"
    pattern: "*BLs*Tracking*"
    sheets: ["BLs Tracking"]
    join_on: BL
    weight: 0.90
    required: false
    role: "ردیابی بارنامه‌ها (enrichment لجستیکی درجه‌دوم؛ سازنده جمعیت نیست)"
    enabled: true

  moghavemat:
    # ⚠️ مسیر واقعی (تأییدشده): GS_Combine\OUTPUT — نه پوشه اسماعیلی.
    # با مسیر غلط، فایل پیدا نمی‌شد و کل دومینو از گام اول قطع می‌شد:
    # مقاومت نیامد ⇒ کد متریال ساخته نشد ⇒ Oracle به هیچ نچسبید ⇒
    # موجودی صفر ⇒ همه قطعات در طبقه «نامشخص».
    folder: "${GS_COMBINE_OUT_DIR}"
    pattern: "*Commercial Expert Data*"
    sheets: ["Expert Data"]
    join_on: ORDER
    frames:
      main: ORDER
      inventory: ORDER_MATERIAL
    weight: 1.00
    required: false
    role: "مرجع درجه‌اول و سازنده جمعیت: چرخه خرید + موجودی کارشناسی نزد سازنده/درراه/گمرک"
    enabled: true
    notes: >
      ستون Data type چند مقدار دارد (Pre Purchase Approval Data / Purchase
      Approval Data) پس فایل چندنوعی است. ستون BL No. حاوی شماره فنی/پروفرما
      است نه بارنامه و قرنطینه می‌شود. سه مقدار کمی «نزد سازنده / در راه /
      گمرک» منبع اصلی کارشناسی Supply Position هستند و در فریم inventory با
      دانه ORDER_MATERIAL ادغام می‌شوند؛ blank هرگز صفر فرض نمی‌شود.

  sata:
    folder: "${BLS_TOTAL_DIR}"
    pattern: "*SATA*"
    sheets: ["Sata Tracking"]
    join_on: BL
    weight: 0.90
    role: "پل بارنامه ↔ ثبت سفارش + کد رهگیری ساتا + اعتبارات (شاهد درجه‌دوم)"
    enabled: true
    notes: >
      پل مستقیم و قوی BL ↔ ORDER ↔ REG است، اما تنها مسیر بیزینسی ثبت سفارش
      نیست. اتصال NTSW در DWH از هاب Import Licence و KEY_REG_FILE نیز برقرار
      می‌شود. SATA برای spine لجستیک شاهد مستقیم مهم است، نه منبع یگانه حقیقت.

  clearance:
    folder: "${CLEARANCE_DIR}"
    pattern: "*Clearance*"
    sheets: [null]
    sheet_strategy: all_data_sheets
    skip_sheets: ["Help", "Sheet2", "data", "Data", "راهنما"]
    join_on: BL
    weight: 0.90
    multi_file: true
    dedupe_by: CL_REF_DATE
    role: "ترخیص گمرکی — دریایی، هوایی، زمینی، چابهار"
    enabled: true
    notes: >
      هر فایل شیت هم‌نام خودش را دارد (Sea/Air/Land/chabaharClearance) و
      تعداد ستون‌ها متفاوت است. «ترخیص کامل» و «ترخیص درصدی» علامت «*» هستند
      نه تاریخ؛ تاریخ واقعی در «تاریخ بارگیری» است.

  cotage:
    folder: "${BLS_TOTAL_DIR}"
    pattern: "*Cottage*"
    sheets: ["Cottage Tracking"]
    join_on: BL
    weight: 0.88
    role: "کوتاژ، ترخیص درصدی/کامل، مرز ورودی و گمرک مقصد"
    enabled: true

  oracle:
    folder: "${BLS_TOTAL_DIR}"
    # فایل واقعی Oracle.xlsx است؛ هیچ فایلی با نام Total_Report وجود ندارد.
    # نام شیت داخل فایل «Total_Report 14050610» است، نه نام فایل.
    pattern: "*Oracle*"
    sheets: [null]
    join_on: MATERIAL
    weight: 0.80
    role: "متریال، موجودی ایران‌خودرو و ساپکو، نیاز روزانه — مبنای مقاومت"
    enabled: true
    notes: >
      ستون «قطعه بحراني» در فایل کاملاً خالی است، پس بحرانی بودن باید
      محاسبه شود. مقاومت = (موجودی ایران‌خودرو + ساپکو + در راه + در گمرک)
      ÷ نیاز روزانه قطعات.

  ntsw:
    folder: "${FOREIGN_DIR}"
    pattern: "*NTSW*"
    sheets: ["Release Commitment", "Allocation", "Import License", "Import Licence"]
    join_on: REG
    weight: 1.00
    required: false
    role: "مرجع درجه‌اول و سازنده جمعیت: مجوز واردات + تعهدات ارزی + تخصیص ارز"
    enabled: true
    notes: >
      Import License/Import Licence محور اتصال شماره پرونده ثبت سفارش به NTSW است.
      Release Commitment و Allocation بر کد ثبت سفارش کار می‌کنند؛ اتصال آنها به
      سایر بیزینس از Import Licence → KEY_REG_FILE → IL Append و سپس کلیدهای معتبر IL انجام می‌شود.
      تعهدها چندردیفی و Allocation درخواست‌محور است.

  fx_transaction:
    folder: "${FOREIGN_DIR}"
    pattern: "*Foreign*Exchange*Transaction*"
    file_names: ["IKCO, Foreign Exchange Transaction.xlsx", "IKCO, Foreign Exchange Transaction, 1405.xlsx"]
    multi_file: true
    sheets: [null]
    join_on: REG
    weight: 0.86
    dedupe_by: FX_BUY_DATE
    role: "خرید ارز — نرخ، مبلغ، وضعیت، تاریخ اعتبار تخصیص"
    enabled: true

  credit:
    folder: "${FOREIGN_DIR}"
    pattern: "*Credit*"
    sheets: ["PURCREDIT"]
    join_on: REG
    weight: 0.70
    role: "اعتبارات اسنادی — گشایش، ارزش پروفرما، آخرین وضعیت"
    enabled: true

  ilappend:
    folder: "${FOREIGN_DIR}"
    pattern: "*IL*"
    sheets: ["Append"]
    join_on: REG
    weight: 0.68
    role: "الحاقیه ثبت سفارش"
    enabled: true
    notes: >
      ⚠️ دو ستون شبیه هم دارد: «شماره ثبت سفارش» (۸ رقمی، کلید NTSW) و
      «شماره پرونده ثبت سفارش» (۹ رقمی، شماره پرونده). نسخه قبلی دومی را
      به‌عنوان کلید گرفته بود و به همین دلیل NTSW هیچ‌وقت وصل نشد.

  sap:
    folder: "${GS_FULL_CHAIN_DIR}"
    pattern: "*GS_Full Chain*"
    sheets: ["Data"]
    native_sheets: ["pr", "pack", "po", "inbound", "GR"]
    join_on: PR
    weight: 0.82
    role: "برنامه‌ریزی و خرید SAP — PR Item / Workflow / PO Item"
    enabled: true
    notes: >
      V29.7.6: فایل SAP چند Grain مستقل دارد. raw_rows برای lineage، pr_items برای
      PR×Item، workflow_rows برای تاریخچه Workflow/Package و po_items برای PO×Item.
      فقط main (آخرین projection در سطح PR) به Flat Report قدیمی merge می‌شود؛
      تحلیل BI/DWH و Chatbot باید از Factهای native-grain استفاده کند. هیچ fuzzy join
      بین PR/PO/ORDER/REG مجاز نیست و تاریخ‌های خام در کنار ISO استاندارد حفظ می‌شوند.

  doccheck:
    folder: "${MOHAMADI_DIR}"
    pattern: "*Document*"
    sheets: ["Checking"]
    # ⚠️ ستون بارنامه در این فایل پرشدگی صفر دارد و «Order Number» صد درصد.
    # جوین روی BL یعنی حذف کامل ۳۲۱۳ ردیف.
    join_on: ORDER
    dedupe_by: DOC_SUBMIT_DATE
    weight: 0.55
    role: "بررسی و مغایرت اسناد (سطح سند)"
    enabled: true
    notes: >
      کاردینالیتی این فایل «سند» است نه «قلم سفارش»؛ پیش از ادغام روی
      شماره سفارش به آخرین وضعیت تقلیل داده می‌شود تا جوین many-to-many
      ردیف‌های خط لوله را تکثیر نکند.

  hr:
    folder: "${HR_DIR}"
    pattern: "*HR_Main_Updated*"
    sheets: [null]
    join_on: EMP
    weight: 0.50
    required: true
    role: "پرسنل و سلسله‌مراتب سازمانی"
    enabled: true

  missmohammadi:
    folder: "${MOHAMADI_DIR}"
    pattern: "*Miss*Mohammadi*"
    sheets: [null]
    join_on: BL
    weight: 0.40
    role: "داده تکمیلی"
    enabled: false
    notes: "هیچ فایلی با این الگو در پوشه یافت نشد (تأیید‌شده در HEADERS_MAP)."

# سیاست اعتبار شواهد V29.7.3 — برای کل گزارش، نه فقط Cash Flow/رفع تعهد:
#   درجه ۱: moghavemat (فایل کارشناسان) و ntsw
#   درجه ۲: abbasi و sata
#   سایر سورس‌ها: تکمیلی؛ فقط وقتی tier بالاتر برای همان فیلد خالی است.
# این authority در gsi/config/authority.py روی تمام canonical/derived fields اعمال می‌شود.
# weight فقط سیگنال سازگاری قدیمی است؛ merge_order الزام فنی اتصال flat mart است و
# ممکن است برای ساخت کلید REG همچنان SATA را پیش از joinهای REG لازم داشته باشد.

# جمعیت اصلی پیش از merge از اجتماع کارشناسان + NTSW ساخته می‌شود.
# عباسی فقط BLهای مشاهده‌شده برای سفارش‌های همان جمعیت را enrich می‌کند و
# هیچ سفارش Abbasi-only اجازه ایجاد ردیف جدید ندارد.
# ترتیب ادغام — منطق علّی enrichment، نه تعیین population/authority:
#   ۱ مقاومت (فریم‌های جزئی) و SAP: کد متریال و PR را می‌آورند
#   ۲ oracle: موجودی را روی کد متریال می‌چسباند
#   ۳ sata: برای flat mart، پل مستقیم BL↔ORDER↔REG را می‌آورد
#   ۴ گمرکی‌ها، سپس سورس‌های سطح ثبت سفارش
# توجه: این ترتیب merge مربوط به mart تخت است؛ مدل canonical DWH برای NTSW از
# Import Licence → KEY_REG_FILE → IL Append استفاده می‌کند و به SATA وابسته نیست.
merge_order:
  - moghavemat
  - sap
  - oracle
  - sata
  - clearance
  - cotage
  - doccheck
  - ilappend
  - fx_transaction
  - credit
