# ساخته‌شده از app/theme.py — دستی ویرایش نکنید.
# نبودِ این فایل یعنی تم از مرورگر می‌آید و متن نامرئی می‌شود.
[theme]
base = "light"
font = "sans serif"
primaryColor = "#007D6E"
backgroundColor = "#E1F2E9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#14332C"

[server]
headless = true

[browser]
gatherUsageStats = false
