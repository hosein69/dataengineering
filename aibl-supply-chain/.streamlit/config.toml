# پیکربندی تم — راه رسمی Streamlit برای فونت و رنگ.
# بدون این فایل، ویجت‌های داخلی (اسلایدر، تب، جدول) فونت پیش‌فرض
# «Source Sans» را نگه می‌دارند و CSS سفارشی به آن‌ها نمی‌رسد.
[theme]
base = "light"
font = "sans serif"
primaryColor = "#0f6e6e"            # آبی برند — نه قرمز پیش‌فرض
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#eef4f3"
textColor = "#0b0b0b"

[server]
headless = true

[browser]
gatherUsageStats = false
