# ساخته‌شده از app/theme.py — دستی ویرایش نکنید.
# نبودِ این فایل یعنی تم از مرورگر می‌آید و متن نامرئی می‌شود.
[theme]
base = "light"
font = "sans serif"
primaryColor = "#007D6E"
backgroundColor = "#F1F1F0"
secondaryBackgroundColor = "#FBFBFA"
textColor = "#22282B"

[server]
headless = true

[browser]
gatherUsageStats = false
