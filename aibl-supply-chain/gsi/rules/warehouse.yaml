# ═══════════════════════════════════════════════════════════════════════════
#  سامانه جامع انبارها و مراکز نگهداری کالا
#  ثبت انبار → اظهار ورود کالا → قبض انبار الکترونیکی → اظهار خروج
#
#  ⚠️ نکته حاکمیتی — این را پیش از هر استفاده بخوانید:
#
#  عددهای مهلت در این بسته status: needs_verification دارند و
#  automatic_apply: false هستند. یعنی موتور با آنها **تصمیم نمی‌گیرد**؛
#  فقط شکاف شاهد را علامت می‌زند و می‌گوید «اینجا قبض انبار نیست».
#
#  دلیلش این است که مهلت دقیق اظهار، بسته به نوع انبار (عمومی/اختصاصی/
#  گمرکی)، نوع کالا و بخشنامه جاری فرق می‌کند و متن رسمی قابل استناد در
#  اختیار این پکیج نبوده است. هر عددی که اینجا حدس زده شود و verified
#  علامت بخورد، بدتر از نبودنش است: گزارش، قطعیتی می‌سازد که پشتش نیست.
#
#  برای فعال‌کردن تصمیم خودکار: عدد را با آخرین بخشنامه تطبیق دهید،
#  source_locator را با شماره و تاریخ نامه پر کنید، status را verified و
#  automatic_apply را true بگذارید. تا آن لحظه، سیستم fail-closed می‌ماند.
# ═══════════════════════════════════════════════════════════════════════════
pack: warehouse
version: "1.0"
updated_at: "2026-09-18"

# ───────────────────────────────────────────────────────────────────────────
# ۰) چرا این بسته وجود دارد
# ───────────────────────────────────────────────────────────────────────────
purpose:
  fa: >-
    زنجیره شاهد یک محموله وارداتی با ترخیص تمام نمی‌شود. کالا پس از ترخیص
    باید در سامانه جامع انبارها اظهار شود و قبض انبار الکترونیکی بگیرد.
    تا پیش از این بسته، گزارش GSI پس از «ترخیص کامل» ساکت می‌شد و آخرین
    حلقه زنجیره — که کالا واقعاً کجاست — دیده نمی‌شد.
  gap_closed: "ترخیص شده ولی قبض انبار ندارد"
  status: internal

# ───────────────────────────────────────────────────────────────────────────
# ۱) شناسه‌های سامانه
# ───────────────────────────────────────────────────────────────────────────
identifiers:
  warehouse_receipt:
    fa: "قبض انبار الکترونیکی"
    role: "شاهد ورود کالا به انبار پس از ترخیص"
    source_field: "WAREHOUSE_RECEIPT"
    status: internal
  goods_id:
    fa: "شناسه کالا"
    role: "شناسه یکتای قلم کالا در سامانه جامع تجارت"
    status: needs_verification
    source_locator: "قانون مبارزه با قاچاق کالا و ارز و آیین‌نامه شناسه کالا/شناسه رهگیری — متن رسمی باید در Rule Registry آرشیو شود"
  tracking_id:
    fa: "شناسه رهگیری"
    role: "شناسه یکتای بسته/محموله برای رهگیری در زنجیره"
    status: needs_verification
    source_locator: "همان منبع بالا"

# ───────────────────────────────────────────────────────────────────────────
# ۲) مهلت‌ها — هیچ‌کدام خودکار اعمال نمی‌شوند
# ───────────────────────────────────────────────────────────────────────────
deadlines:
  declare_inbound_days:
    fa: "مهلت اظهار ورود کالا به انبار در سامانه"
    value: 3
    unit: day
    status: needs_verification
    automatic_apply: false
    note: >-
      مقدار پیش‌فرض داخلی برای *علامت‌گذاری* است، نه برای حکم. تا وقتی
      verified نشود، موتور فقط «دیرکرد محتمل» می‌گوید و هیچ ردیفی را
      متخلف اعلام نمی‌کند.
    source_locator: "نیازمند استناد به آیین‌نامه اجرایی سامانه جامع انبارها"
  declare_outbound_days:
    fa: "مهلت اظهار خروج کالا از انبار"
    value: 3
    unit: day
    status: needs_verification
    automatic_apply: false
    source_locator: "نیازمند استناد"

# ───────────────────────────────────────────────────────────────────────────
# ۳) آستانه‌های پایش — داخلی و صریح
#    اینها قاعده قانونی نیستند؛ آستانه پایش سازمانی‌اند و همین‌طور هم
#    برچسب خورده‌اند تا کسی آنها را به‌جای بخشنامه نخواند.
# ───────────────────────────────────────────────────────────────────────────
monitoring:
  receipt_overdue_days:
    fa: "پس از این تعداد روز از ترخیص، نبودِ قبض انبار «شکاف شاهد» شمرده می‌شود"
    value: 7
    unit: day
    status: internal
  receipt_stale_days:
    fa: "شکاف شاهدی که بیش از این بماند، بحرانی است"
    value: 30
    unit: day
    status: internal

# ───────────────────────────────────────────────────────────────────────────
# ۴) وضعیت‌های اظهار انبار
#    ترتیب همان ترتیب بدی است: از بالا به پایین بدتر نمی‌شود، بهتر می‌شود.
# ───────────────────────────────────────────────────────────────────────────
states:
  - code: DECLARED
    fa: "اظهار شده"
    tone: good
    means: "قبض انبار ثبت شده است"
  - code: LATE
    fa: "اظهار با تأخیر"
    tone: warning
    means: "قبض انبار هست ولی دیرتر از آستانه پایش ثبت شده"
  - code: OVERDUE
    fa: "شکاف شاهد انبار"
    tone: serious
    means: "ترخیص شده، از آستانه گذشته و قبض انبار هنوز نیست"
  - code: CRITICAL_GAP
    fa: "شکاف شاهد کهنه"
    tone: critical
    means: "شکاف شاهد بیش از آستانه بحرانی مانده است"
  - code: SEQUENCE_CONFLICT
    fa: "تناقض ترتیب تاریخ"
    tone: warning
    means: >-
      قبض انبار پیش از تاریخ ترخیص ثبت شده است. یکی از دو تاریخ غلط است یا
      از دو سامانه ناسازگار آمده‌اند؛ تا رفع مغایرت، فاصله اظهار قابل اتکا
      نیست. عمداً «اظهار شده» شمرده نمی‌شود تا مغایرت پنهان نماند.
  - code: PENDING
    fa: "هنوز موعدش نرسیده"
    tone: neutral
    means: "ترخیص شده ولی هنوز داخل مهلت پایش است"
  - code: NOT_CLEARED
    fa: "هنوز ترخیص نشده"
    tone: neutral
    means: "کالا هنوز ترخیص نشده؛ اظهار انبار موضوعیت ندارد"
  - code: UNKNOWN
    fa: "نامشخص"
    tone: unknown
    means: "تاریخ ترخیص یا وضعیت آن در دسترس نیست — Unknown با Zero یکی نمی‌شود"
