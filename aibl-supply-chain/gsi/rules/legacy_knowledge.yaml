  - id: HIST_ABC_CLOCK_MODEL
    kind: historical_rule
    title: "مدل سه ساعت A/B/C در گزارش قدیمی"
    description: "A: از ایجاد تعهد تا ارائه اسناد برای ظهرنویسی؛ B: از ایجاد تعهد تا مجوز بارگیری/رسید مالی؛ C: از کد رهگیری تا ترخیص کامل. این مدل برای توضیح سابقه و بازسازی گزارش قدیمی است."
    source_id: legacy_commitment_notes
    source_class: legacy_training
    source_date: "2024-12-17"
    source_location: "PDF pages 4-6"
    status: legacy_reference
    binding: false
    confidence: high
    tags: [deadline, A, B, C, settlement]
    evidence_requirements: ["تاریخ ایجاد تعهد", "تاریخ ارائه اسناد", "تاریخ مجوز بارگیری/رسید مالی", "تاریخ کد رهگیری", "تاریخ ترخیص کامل"]
    historical_parameters:
      commercial_cbu: {A_months: 6, B_months: 8, C_months: 1}
      production: {A_months: 9, B_months: 11, C_months: 1}
      machinery: {A_months: 16, B_months: 18, C_months: 1}

