rate_semantics:
  - code: LEGACY_REFERENCE_NORMALIZATION_RATE
    fa: "نرخ مرجع ثابت گزارش قدیمی"
    source: legacy_rates
    permitted_use: "بازسازی گزارش تاریخی/مقایسه شکلی"
    forbidden_use: "محاسبه P&L واقعی یا زیان تبدیل ارز در تاریخ تراکنش"
  - code: FX_PURCHASE_RATE
    fa: "نرخ خرید ارز از بانک/مرکز مبادله"
    required_evidence: ["اعلامیه فروش ارز/سند بانکی", "تاریخ خرید"]
  - code: SUPPLIER_SETTLEMENT_RATE
    fa: "نرخ ریالی معادل ارز پرداختی به ذی‌نفع"
    required_evidence: ["پیام/رسید پرداخت", "ارز و مبلغ مقصد", "تاریخ پرداخت"]
  - code: CROSS_RATE
    fa: "نرخ تبدیل ارز مبدأ به ارز مقصد"
    required_evidence: ["رسید conversion/deal ticket", "ارز مبدأ و مقصد"]
  - code: ACCOUNTING_RATE
    fa: "نرخ حسابداری"
    required_evidence: ["سند حسابداری/سیاست نرخ"]
  - code: FEES
    fa: "کارمزد بانکی/تبدیل/انتقال"
    required_evidence: ["سند کارمزد/صورتحساب بانک یا صرافی"]

