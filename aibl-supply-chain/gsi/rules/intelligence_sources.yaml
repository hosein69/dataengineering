  - id: iranexpconfederation
    url: "https://t.me/iranexpconfederation"
    level: FIELD_SIGNAL
    scope: ["صادرات و واردات", "بخشنامه‌ها", "رویه‌های تجاری"]
  - id: arziiran2
    url: "https://t.me/arziiran2"
    level: FIELD_SIGNAL
    scope: ["ارز", "رفع تعهد", "بانک مرکزی", "سامانه جامع تجارت"]
