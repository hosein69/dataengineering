# ═══════════════════════════════════════════════════════════════════════════
# Field Intelligence Sources — منابع میدانی/آموزشی برای کشف Signal
# هیچ پیام تلگرامی به‌تنهایی Rule الزام‌آور یا Fraud Finding ایجاد نمی‌کند.
# ═══════════════════════════════════════════════════════════════════════════
pack: intelligence_sources
version: "1.0"
updated_at: "2026-09-17"

trust_model:
  binding_levels:
    - code: OFFICIAL_BINDING
      fa: "رسمی و لازم‌الاتباع"
      can_auto_enforce: true
      examples: ["بانک مرکزی", "گمرک جمهوری اسلامی ایران", "سامانه جامع تجارت/وزارت صمت", "هیئت وزیران", "روزنامه رسمی"]
    - code: OFFICIAL_OPERATIONAL
      fa: "اطلاعیه رسمی عملیاتی سامانه/دستگاه"
      can_auto_enforce: true
      requires_effective_date: true
    - code: VERIFIED_FIELD_INTELLIGENCE
      fa: "اطلاع میدانی صحت‌سنجی‌شده"
      can_auto_enforce: false
      minimum_corroboration: "اصل بخشنامه/اطلاعیه رسمی یا حداقل دو شاهد مستقل معتبر"
    - code: FIELD_SIGNAL
      fa: "سیگنال میدانی تأییدنشده"
      can_auto_enforce: false
      action: "فقط Investigation Lead / هشدار داده‌ای"

verification_workflow:
  - "ذخیره متن/تصویر/فایل پیام و تاریخ انتشار"
  - "استخراج شماره بخشنامه، مرجع صادرکننده، تاریخ اثر و دامنه شمول"
  - "تطبیق با منبع رسمی بانک مرکزی/گمرک/NTSW/مصوبه"
  - "ثبت نسخه Rule با effective_from / expires_on / eligibility"
  - "عدم اعمال خودکار در صورت نبود اصل سند یا ابهام در دامنه شمول"

