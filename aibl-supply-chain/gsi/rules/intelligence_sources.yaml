    url: "https://ble.ir/ntsw_ir"
    level: OFFICIAL_OPERATIONAL
    scope: ["سامانه جامع تجارت", "اطلاعیه عملیاتی NTSW", "تغییرات کاربری و فرآیندی"]
    note: "برای تبدیل به Rule الزام‌آور، اصل ابلاغ/اطلاعیه و تاریخ اثر در Evidence Registry نگهداری شود."
  - id: customs_commercial
    url: "https://ble.ir/customs_commercial"
    level: FIELD_SIGNAL
    scope: ["مقررات گمرکی", "بازرگانی", "ترخیص", "بخشنامه‌ها"]
    note: "منبع کشف Signal؛ متن الزام‌آور باید با گمرک/وزارت صمت/بانک مرکزی تطبیق شود."

policy:
  never_from_field_signal_only:
    - "اعلام قطعی تقلب یا سوءنیت"
    - "محاسبه جریمه قانونی"
    - "بستن پرونده رفع تعهد"
    - "اعمال مهلت قانونی جدید"
    - "مجاز دانستن جابه‌جایی پول بین پرونده‌ها"
  allowed_outputs:
    - "Evidence Gap"
    - "Investigation Signal"
    - "پیشنهاد صحت‌سنجی Rule"
    - "روایت عملیاتی با برچسب منبع و سطح اعتبار"
