# ═══════════════════════════════════════════════════════════════════════════
#  نظام هماهنگ‌شده توصیف و کدگذاری کالا (HS) + تعرفه ۸ رقمی ایران
#
#  نسخه جاری بین‌المللی: HS 2022 (هفتمین ویرایش، لازم‌الاجرا از ۲۰۲۲-۰۱-۰۱).
#  نسخه بعدی: HS 2028 (هشتمین ویرایش) — لازم‌الاجرا از ۲۰۲۸-۰۱-۰۱،
#  شامل ۲۹۹ دسته تغییر (۴۲۸ زیرشماره جدید، حذف ۱۷۲ زیرشماره).
#  متن نهایی در ژانویه ۲۰۲۶ منتشر شد؛ پنجره پیاده‌سازی: ۲۰۲۶ و ۲۰۲۷.
#  ⚠️ اقدام لازم: پیش از ۲۰۲۸-۰۱-۰۱ جداول تطبیق HS2022→HS2028 اعمال شود.
# ═══════════════════════════════════════════════════════════════════════════
pack: hs_codes
version: "1.0"
current_edition: "HS 2022"
current_edition_effective: "2022-01-01"
next_edition: "HS 2028"
next_edition_effective: "2028-01-01"
publisher: "World Customs Organization (WCO)"
status: verified
updated_at: "2026-08-31"

structure:
  chapter_digits: 2
  heading_digits: 4
  subheading_digits: 6          # سطح بین‌المللی مشترک
  national_digits: 8            # تعرفه ملی ایران
  fa: "۲ رقم فصل → ۴ رقم شماره تعرفه → ۶ رقم زیرشماره بین‌المللی → ۸ رقم تعرفه ملی ایران"
  validation:
    pattern_6: "^[0-9]{6}$"
    pattern_8: "^[0-9]{8}$"
    formatted: "^[0-9]{4}\\.[0-9]{2}(\\.[0-9]{2})?$"

