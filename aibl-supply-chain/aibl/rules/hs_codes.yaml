# شماره‌های تعرفه پرکاربرد در سبد خرید ابزار و قطعه
common_headings:
  - code: "8207"
    fa: "ابزارهای تعویضی برای ابزار دستی یا ماشین‌افزار (مته، قلاویز، حدیده، برقو)"
    examples: [مته, قلاویز, برقو, "مته الماسه", "قلاویز ماشینی"]
  - code: "8208"
    fa: "کاردها و تیغه‌های برنده برای ماشین‌ها"
  - code: "8209"
    fa: "صفحه، میله، نوک و اشیای همانند برای ابزارها، سوارنشده، از سرمت"
    examples: [تیغچه الماسه, اینسرت, "کف تراش"]
    priority: high
  - code: "8466"
    fa: "اجزا و قطعات و متفرعات ماشین‌افزار (نگهدارنده ابزار، کولت، آداپتور)"
    examples: [کولت, "نگهدارنده ابزار", آداپتور, "نگهدارنده قلاویز"]
  - code: "8467"
    fa: "ابزارهای پنوماتیک، هیدرولیک یا با موتور برقی/غیربرقی خودگردان"
    examples: ["بکس بادی", "اسپیندل", "ابزار برقی"]
  - code: "8482"
    fa: "بلبرینگ و رولربرینگ"
  - code: "8483"
    fa: "درخت انتقال نیرو، یاتاقان، چرخ‌دنده، کوپلینگ"
    examples: [شافت, کوپلینگ, "واسطه کوپلینگ"]
  - code: "8708"
    fa: "اجزا و قطعات و متفرعات وسایل نقلیه موتوری"
    priority: high
  - code: "6804"
    fa: "سنگ آسیاب، سنگ سنباده و اشیای همانند"
    examples: ["سنگ سنباده", "سنگ الماسه هون"]
  - code: "7318"
    fa: "پیچ، پیچ گاوصندوقی، مهره، واشر و اشیای همانند از آهن یا فولاد"
    examples: [پیچ, مهره, واشر, "پیچ آلن"]

