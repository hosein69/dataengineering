import_groups_note:
  status: needs_verification
  fa: >
    گروه‌بندی کالایی و اولویت تخصیص ارز توسط وزارت صمت و بانک مرکزی تعیین
    و به‌طور دوره‌ای بازنگری می‌شود. مقادیر بالا صرفاً ساختار است و باید با
    آخرین فهرست ابلاغی به‌روزرسانی شود.

