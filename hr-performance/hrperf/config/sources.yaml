# ═══════════════════════════════════════════════════════════════════════════
#  دفترچه سورس‌ها — افزودن سورس تازه، بدون دست زدن به کد
#
#  هر ورودی می‌گوید: فایل‌های این سورس چه شکلی‌اند، ستون کلید فرد کدام
#  است، و کدام ستون به کدام شاخص مدل می‌رود.
#
#  دو سورس داخلی («aibl» و «wide») در کد پیاده شده‌اند و اینجا فقط برای
#  دیده‌شدن اعلام شده‌اند. سورس‌های شما زیر «custom» اضافه می‌شوند.
#
#  کمترین چیزی که یک سورس تازه لازم دارد:
#
#     my_unit:
#       label: خروجی واحد بازرسی
#       match: "*بازرسی*"        # الگوی نام فایل
#       person_key: کد پرسنلی     # ستون کلید فرد
#       metrics:
#         نرخ_تطابق: {metric: conformance_score, sample: تعداد پرونده}
#
#  «metric» باید کلید یک شاخص موجود در model.yaml باشد. اگر شاخص تازه
#  می‌خواهید، اول آن را در داشبورد (تب «استودیوی مدل») بسازید.
# ═══════════════════════════════════════════════════════════════════════════
version: 1

builtin:
  aibl:
    label: پروندهٔ زنجیره تأمین (AIBL)
    detect_columns: [EXPERT_PURCHASING, EXPERT_COMMERCIAL, EXPERT_LOGISTICS]
    note: >
      خودکار تشخیص داده می‌شود و سنجه‌ها به تفکیک حوزه ساخته می‌شوند.
      نگاشت ستون‌ها در hrperf/dataio/aibl.py::COLS است.
  long:
    label: جدول بلند استاندارد
    columns: [person_key, metric_key, value, sample_n]
  wide:
    label: جدول عریض (هر شاخص یک ستون)
    note: "ستون <شاخص>_n به‌عنوان اندازه نمونه برداشته می‌شود."

custom: {}
