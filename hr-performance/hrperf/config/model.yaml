    direction: lower
    kind: duration
    entry: direct
    role: scored
    scope: ANY
    q_target: 20
    source: aibl
    aibl_field: "فاصله تاریخ‌های متوالی لاگ رویداد، محدود به مرحله‌های حوزه"
