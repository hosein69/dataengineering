# ═══════════════════════════════════════════════════════════════════════════
#  مدل عملکرد ۳٫۰ — کلاسترها از نتیجهٔ AIBL می‌آیند
#
#  تا نسخه ۲، کلاسترها از دو سورس قدیمی HR ساخته می‌شدند
#  (document_checking و il_analysis): «کیفیت»، «سرعت»، «بازدهی».
#  نام‌ها درست بودند ولی جنس داده، ورودیِ کار بود نه نتیجهٔ آن.
#
#  حالا سرچشمه، خروجی پکیج زنجیره تأمین (AIBL) است: یک ردیف به‌ازای هر
#  پرونده، با لاگ رویداد ۱۳ فعالیتی، انطباق فرآیند، طبقه بحرانی قطعه،
#  تعهد ارزی، رسوب گمرکی، و — مهم‌تر از همه — **حوزه مسئولیت** هر مرحله.
#
#  ─── سه قاعدهٔ ساخت این مدل ────────────────────────────────────────────
#
#  ۱) هر سنجه «حوزه» دارد.  کارشناس حمل بابت تعهد ارزی سنجیده نمی‌شود و
#     کارشناس بازرگانی بابت رسوب گمرکی. سنجه‌ای که بیرون از اختیار فرد
#     است، سنجهٔ عملکرد نیست؛ سنجهٔ بخت است.
#     (مبنا: expert_scope در AIBL؛ و پژوهش ۲۰۲۵ روی ادراک انصاف از
#      ارزیابی الگوریتمی: کارکنان ویژگی‌های درون حیطهٔ اختیار خود را
#      منصفانه، و ویژگی‌های بیرون از کنترل را ناعادلانه می‌بینند.)
#
#  ۲) هر سنجهٔ امتیازی باید مرجع داشته باشد (`citation`). مدل بدون مرجع
#     ذخیره نمی‌شود — اعتبارسنجی جلویش را می‌گیرد. عددی که دربارهٔ آدم‌ها
#     تصمیم می‌گیرد و پشتش «چون به نظرمان درست آمد» باشد، قابل دفاع نیست.
#
#  ۳) نتیجه‌ای که فرد در آن مؤثر است، امتیاز می‌گیرد؛ شرایطی که در آن
#     نیست، فقط تعدیل‌گر است. حجم کار، ارزش ارزی و سختی قطعه هرگز
#     امتیاز نمی‌گیرند — ولی در لایه علّی، انتظار را تنظیم می‌کنند.
#
#  ─── مبنای علمی کلاسترها ───────────────────────────────────────────────
#
#  • SCOR (ASCM) — Perfect Order Fulfilment (RL.1.1) و اجزای چهارگانه‌اش:
#    به‌موقع، کامل، اسناد درست، بدون آسیب. کلاستر «اتکاپذیری» عیناً همین
#    ساختار است، در سطح مرحله‌های هر حوزه.
#  • Pika و همکاران، «چارچوب توسعه‌پذیر تحلیل رفتار منابع از لاگ رویداد»
#    (BPM 2013 / TMIS 2017) — پنج منظر رفتار منبع: مهارت، بهره‌گیری،
#    ترجیح، بهره‌وری، همکاری. کلاسترهای «انطباق»، «پاسخ‌گویی» و «همکاری»
#    از همین منظرها آمده‌اند و از لاگ رویداد AIBL قابل استخراج‌اند.
#  • van der Aalst — Conformance Checking: انحراف از مسیر مرجع، سنجه‌ای
#    عینی و قابل ردیابی است، نه قضاوت. مرحله ۸۵ AIBL همین را می‌سازد.
#  • DORA — سرعت و پایداری همیشه جفت سنجیده می‌شوند.
#  • SPACE (GitHub/MSR 2021) — «فعالیت» به‌تنهایی معیار عملکرد نیست.
#  • Six Sigma FPY/RTY — کیفیت بار اول، سنگین‌ترین وزن.
#  • EEOC 1978 (قاعده چهارپنجم) — پایش اثر نامتناسب بر گروه‌ها.
#
#  شرح کامل و نقد هر مرجع در `RESEARCH_BASIS.md`.
# ═══════════════════════════════════════════════════════════════════════════
model_version: "3.0"
updated_at: "2026-09-09"

clusters:
  reliability:
    label: اتکاپذیری تحویل
    weight: 0.30
    rationale: >
      سنگین‌ترین کلاستر، چون تنها چیزی است که خط تولید واقعاً می‌بیند:
      پرونده در مرحله‌های این حوزه، به‌موقع و کامل و با اسناد درست جلو
      رفت یا نه. ساختارش از Perfect Order Fulfilment در SCOR گرفته شده
      و مثل آن، «تقریباً کامل» را کامل حساب نمی‌کند.

  conformance:
    label: انطباق فرآیند
    weight: 0.20
    rationale: >
      از مسیر مرجع منحرف شدن — جا انداختن فعالیت یا انجام خارج از
      ترتیب — سنجه‌ای عینی از لاگ رویداد است، نه قضاوت سلیقه‌ای.
      انحراف، ریشهٔ بیشتر تأخیرهای بعدی است و برخلاف نتیجه، تقریباً
      کامل در اختیار خودِ فرد است.

  responsiveness:
    label: پاسخ‌گویی در حوزهٔ خود
    weight: 0.20
    rationale: >
      «توپ چند روز در زمین این نفر ماند؟» — قابل دفاع‌ترین سنجهٔ فردی در
      یک فرآیند چندنفره، چون فقط زمانی شمرده می‌شود که پرونده منتظر
      همین حوزه بوده است. جفت با اتکاپذیری خوانده می‌شود (اصل DORA) تا
      تندی به قیمت خطا پاداش نگیرد.

  stewardship:
    label: صیانت از تعهد و اسناد
    weight: 0.15
    rationale: >
      تعهد ارزی معوق و سند ناقص، هزینهٔ مستقیم و قابل انتساب می‌سازند.
      این کلاستر عمدتاً حوزهٔ بازرگانی را می‌سنجد و برای دیگران وزن
      مؤثری ندارد — همان قاعدهٔ «هر سنجه در حوزهٔ خودش».

  data_quality:
    label: کیفیت داده و ردیابی‌پذیری
    weight: 0.10
    rationale: >
      AIBL دقیقاً می‌داند چه کسی کدام فیلد را پر نکرده. داده‌ای که ثبت
      نشده، کارِ انجام‌نشده نیست ولی کارِ نامرئی است: نه قابل پیگیری،
      نه قابل دفاع. وزن متوسط، چون کاملاً در اختیار فرد است و اصلاحش
      ارزان‌ترین بهبود ممکن است.

  collaboration:
    label: همکاری و تحویل‌دهی
    weight: 0.05
    rationale: >
      منظر «همکاری» در چارچوب Pika. وزن عمداً کم: شمردن تعداد تحویل‌ها
      به‌سرعت به بازی گرفته می‌شود. اینجا فقط تحویل‌دهی تمیز (بدون
      برگشت) امتیاز می‌گیرد، نه حجم تعامل.

  workload:
    label: بار و پیچیدگی
    weight: 0.00
    scored: false
    rationale: >
      حجم و سختی، «شرایط کار» است نه عملکرد. امتیاز دادن به آن، انگیزهٔ
      برداشتن پروندهٔ بیشتر می‌سازد نه بهتر کار کردن (SPACE, 2021).
      این کلاستر امتیاز نمی‌گیرد و در عوض، در لایه علّی انتظار را تعدیل
      می‌کند و در تب عدالت، چولگی بار را آشکار می‌کند.

  exposure:
    label: مسئولیت مالی و بحرانیت قطعه
    weight: 0.00
    scored: false
    rationale: >
      ارزش ارزی پرونده و بحرانی بودن قطعه، «تخصیص» است نه «عملکرد».
      کسی که قطعات بحرانی گرفته نباید بابت بحرانی بودنشان امتیاز کم
      بگیرد. فقط زمینه — و کنترل‌کنندهٔ اجباری در همهٔ مقایسه‌های علّی.

# ── سنجه‌ها ───────────────────────────────────────────────────────────────
# kind:   quality_rate | duration | ratio | count | money
# entry:  direct | derived
# role:   scored | context | driver
# scope:  ANY | EXPERT_PURCHASING | EXPERT_COMMERCIAL | EXPERT_LOGISTICS
# aibl_field: ستون سرچشمه در خروجی AIBL — ردِ عدد تا داده خام
metrics:

  # ═══ اتکاپذیری تحویل ═══
  perfect_flow_rate:
    label: نرخ جریان بی‌نقص (مرحله‌های حوزه)
    cluster: reliability
    weight: 0.40
    direction: higher
    kind: quality_rate
    entry: derived
    role: scored
    scope: ANY
    q_target: 20
    source: aibl
    formula: perfect_flow
    aibl_field: "STATUS_STAGE + روزهای تأخیر + نوع ترخیص + امتیاز انطباق"
    citation: "SCOR RL.1.1 Perfect Order Fulfilment (ASCM) — همه‌یا‌هیچ، مثل خودِ استاندارد"
    note: >
      پرونده وقتی «بی‌نقص» است که در مرحله‌های این حوزه هر چهار شرط
      برقرار باشد: به‌موقع، کامل، اسناد درست، بدون انحراف. مثل SCOR،
      سه‌تا‌از‌چهار یعنی ناموفق — چون خط تولید هم سه‌چهارم قطعه نمی‌گیرد.

  on_time_stage_rate:
    label: به‌موقع بودن مرحله‌های حوزه
    cluster: reliability
    weight: 0.25
    direction: higher
    kind: quality_rate
    entry: direct
    role: scored
    scope: ANY
    q_target: 20
    source: aibl
    aibl_field: "روزهای تأخیر / مهلت قانونی رفع تعهد / STATUS_AGE_DAYS"
    citation: "SCOR RL.2.2 Delivery Performance to Original Commit Date"

  in_full_rate:
    label: تکمیل کامل (نه ترخیص درصدی)
    cluster: reliability
    weight: 0.20
    direction: higher
    kind: quality_rate
    entry: direct
    role: scored
    scope: EXPERT_LOGISTICS
    q_target: 15
    source: aibl
    aibl_field: "FULL_CLEAR_DATE در برابر PARTIAL_CLEAR_DATE"
    citation: "SCOR RL.2.1 Orders Delivered In Full"

  doc_accuracy_rate:
    label: درستی و کامل بودن اسناد
    cluster: reliability
    weight: 0.15
    direction: higher
    kind: quality_rate
    entry: direct
    role: scored
    scope: ANY
    q_target: 15
    source: aibl
    aibl_field: "SATA_NO / COT_DATE / FIN_RECEIPT_DATE / DOC_SUBMIT_DATE"
    citation: "SCOR RL.2.3 Documentation Accuracy"

  # ═══ انطباق فرآیند ═══
  conformance_score:
    label: امتیاز انطباق با مسیر مرجع
    cluster: conformance
    weight: 0.45
    direction: higher
    kind: quality_rate
    entry: direct
    role: scored
    scope: ANY
    q_target: 20
    source: aibl
    aibl_field: "امتیاز انطباق (٪)"
    citation: "van der Aalst — Conformance Checking؛ مرحله ۸۵ AIBL"

  skipped_activity_rate:
    label: نرخ فعالیت جاافتاده
    cluster: conformance
    weight: 0.30
    direction: lower
    kind: quality_rate
    entry: direct
    role: scored
    scope: ANY
    q_target: 15
    source: aibl
    aibl_field: "فعالیت‌های جاافتاده"
    citation: "van der Aalst — انحراف نوع «skipped» در بررسی انطباق"

  order_violation_rate:
    label: نرخ نقض ترتیب فعالیت‌ها
    cluster: conformance
    weight: 0.25
    direction: lower
    kind: quality_rate
    entry: direct
    role: scored
    scope: ANY
    q_target: 15
    source: aibl
    aibl_field: "نقض ترتیب"
    citation: "MANDATORY_BEFORE در s85_conformance — پیش‌نیاز منطقی، نه سلیقه"

  # ═══ پاسخ‌گویی در حوزهٔ خود ═══
  ball_in_court_days:
    label: میانه روزهایی که پرونده منتظر این نفر مانده
    cluster: responsiveness
    weight: 0.45
    direction: lower
    kind: duration
    entry: direct
    role: scored
    scope: ANY
    q_target: 20
    source: aibl
    aibl_field: "WAITING_ON_WHO + STATUS_AGE_DAYS"
    citation: "Pika و همکاران — منظر «بهره‌وری»؛ زمان انتظار منتسب به منبع"
    note: >
      قابل دفاع‌ترین سنجهٔ فردی این مدل: فقط وقتی شمرده می‌شود که خودِ
      AIBL گفته باشد توپ در زمین همین حوزه است.

  own_leg_median_days:
