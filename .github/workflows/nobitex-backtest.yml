name: Vibe-Trading Nobitex Backtest (manual, real live data)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "leveraged | watchlist | margin | snapshot | maximise | discover | all"
        required: false
        default: "leveraged"
      symbols:
        description: "Comma separated Nobitex symbols"
        required: false
        default: "BTCIRT,ETHIRT,SOLIRT,XRPIRT,DOGEIRT"
      resolution:
        description: "Nobitex UDF resolution"
        required: false
        default: "15"
      lookback_days:
        description: "Historical lookback in days"
        required: false
        default: "30"
      leverage:
        description: "Requested leverage"
        required: false
        default: "3"

permissions:
  contents: write      # the snapshot mode commits the captured data

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install vibe-trading-ai pandas numpy requests

      # ── uploaded leveraged long/short engine: before vs after the debug ──
      - name: Probe how much history Nobitex actually retains per resolution
        if: ${{ inputs.mode != 'watchlist' && inputs.mode != 'margin' && inputs.mode != 'maximise' && inputs.mode != 'snapshot' }}
        working-directory: "Vibe-Trading Backtest (Nobitex & Wallex)/nobitex_leveraged"
        continue-on-error: true
        run: |
          mkdir -p out_probe
          python scripts/probe_retention.py BTCIRT "${{ inputs.lookback_days }}" out_probe/retention.json

      - name: ORIGINAL leveraged engine (expected to truncate the window)
        if: ${{ inputs.mode != 'watchlist' && inputs.mode != 'margin' && inputs.mode != 'maximise' && inputs.mode != 'snapshot' }}
        working-directory: "Vibe-Trading Backtest (Nobitex & Wallex)/nobitex_leveraged"
        continue-on-error: true
        run: |
          python scripts/nobitex_leveraged_backtest_ORIGINAL.py \
            --symbols "${{ inputs.symbols }}" \
            --resolution "${{ inputs.resolution }}" \
            --lookback-days "${{ inputs.lookback_days }}" \
            --leverage "${{ inputs.leverage }}" \
            --output-dir out_original

      - name: FIXED leveraged engine (paginated, corrected accounting)
        if: ${{ inputs.mode != 'watchlist' && inputs.mode != 'margin' && inputs.mode != 'maximise' && inputs.mode != 'snapshot' }}
        working-directory: "Vibe-Trading Backtest (Nobitex & Wallex)/nobitex_leveraged"
        run: |
          python scripts/nobitex_leveraged_backtest.py \
            --symbols "${{ inputs.symbols }}" \
            --resolution "${{ inputs.resolution }}" \
            --lookback-days "${{ inputs.lookback_days }}" \
            --leverage "${{ inputs.leverage }}" \
            --output-dir out_fixed

      - name: Compare the two windows
        if: ${{ always() && inputs.mode != 'watchlist' && inputs.mode != 'margin' && inputs.mode != 'maximise' && inputs.mode != 'snapshot' }}
        working-directory: "Vibe-Trading Backtest (Nobitex & Wallex)/nobitex_leveraged"
        run: python scripts/compare_original_vs_fixed.py out_original out_fixed

      - name: Discover which Toman pairs Nobitex actually lists
        if: ${{ inputs.mode == 'discover' || inputs.mode == 'all' }}
        continue-on-error: true
        working-directory: "Vibe-Trading Backtest (Nobitex & Wallex)/nobitex_leveraged"
        run: python scripts/discover_universe.py universe_out

      - name: Which of those pairs can actually be traded with leverage
        if: ${{ inputs.mode == 'watchlist' || inputs.mode == 'all' || inputs.mode == 'margin' || inputs.mode == 'maximise' || inputs.mode == 'snapshot' }}
        continue-on-error: true
        working-directory: "Vibe-Trading Backtest (Nobitex & Wallex)/nobitex_leveraged"
        run: python scripts/leverage_universe.py universe_out

      - name: Live watchlists — ours vs freqtrade Supertrend
        if: ${{ inputs.mode == 'watchlist' || inputs.mode == 'all' || inputs.mode == 'maximise' }}
        working-directory: "Vibe-Trading Backtest (Nobitex & Wallex)/nobitex_leveraged"
        run: python scripts/watchlist_compare.py watchlist_out

      - name: Entry / invalidation levels for the surviving symbols
        if: ${{ inputs.mode == 'watchlist' || inputs.mode == 'all' || inputs.mode == 'maximise' }}
        working-directory: "Vibe-Trading Backtest (Nobitex & Wallex)/nobitex_leveraged"
        run: python scripts/entry_points.py entry_out

      - name: Capture a dated snapshot of the margin universe's history
        if: ${{ inputs.mode == 'snapshot' }}
        working-directory: "Vibe-Trading Backtest (Nobitex & Wallex)/nobitex_leveraged"
        run: python scripts/snapshot.py data_snapshot

      - name: Commit the snapshot so no later run needs the venue
        if: ${{ inputs.mode == 'snapshot' }}
        working-directory: "Vibe-Trading Backtest (Nobitex & Wallex)/nobitex_leveraged"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_snapshot
          if git diff --cached --quiet; then
            echo "snapshot unchanged, nothing to commit"
          else
            git commit -m "Capture Nobitex margin-universe history snapshot"
            # The capture takes tens of minutes, so the branch can easily have
            # moved on since checkout — it did once, and the rejected push threw
            # away the whole capture. Rebase onto whatever landed meanwhile and
            # retry rather than losing the data to a race.
            for attempt in 1 2 3; do
              git fetch origin ${{ github.ref_name }}
              git rebase origin/${{ github.ref_name }} || { git rebase --abort; exit 1; }
              if git push origin HEAD:${{ github.ref_name }}; then
                echo "snapshot pushed on attempt $attempt"
                exit 0
              fi
              sleep 5
            done
            echo "push failed after 3 attempts; the snapshot is still in the artifact"
            exit 1
          fi

      - name: Search for the highest-return configuration, train/test split
        if: ${{ inputs.mode == 'maximise' || inputs.mode == 'all' }}
        working-directory: "Vibe-Trading Backtest (Nobitex & Wallex)/nobitex_leveraged"
        run: python scripts/maximize.py max_out

      # ── earlier suites, only when explicitly asked for ──
      - name: Vibe-Trading baseline suites
        if: ${{ inputs.mode == 'all' }}
        working-directory: "Vibe-Trading Backtest (Nobitex & Wallex)/local_run_demo"
        run: |
          python run_on_github.py
          python run_five_symbols.py
          python live_watchlist.py

      - name: Upload results (short retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nobitex-backtest-results
          path: |
            Vibe-Trading Backtest (Nobitex & Wallex)/nobitex_leveraged/out_original
            Vibe-Trading Backtest (Nobitex & Wallex)/nobitex_leveraged/out_fixed
            Vibe-Trading Backtest (Nobitex & Wallex)/nobitex_leveraged/out_probe
            Vibe-Trading Backtest (Nobitex & Wallex)/nobitex_leveraged/watchlist_out
            Vibe-Trading Backtest (Nobitex & Wallex)/nobitex_leveraged/entry_out
            Vibe-Trading Backtest (Nobitex & Wallex)/nobitex_leveraged/universe_out
            Vibe-Trading Backtest (Nobitex & Wallex)/nobitex_leveraged/max_out
            Vibe-Trading Backtest (Nobitex & Wallex)/nobitex_leveraged/data_snapshot
          retention-days: 5
