name: Vibe-Trading Nobitex Backtest (manual, real live data)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "which suite to run: leveraged | all"
        required: false
        default: "leveraged"
      symbols:
        description: "Comma separated Nobitex symbols"
        required: false
        default: "BTCIRT,ETHIRT,SOLIRT,XRPIRT,DOGEIRT"
      resolution:
        description: "Nobitex UDF resolution"
        required: false
        default: "15"
      lookback_days:
        description: "Historical lookback in days"
        required: false
        default: "30"
      leverage:
        description: "Requested leverage"
        required: false
        default: "3"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install vibe-trading-ai pandas numpy requests

      # ── uploaded leveraged long/short engine: before vs after the debug ──
      - name: Probe how much history Nobitex actually retains per resolution
        if: ${{ inputs.mode != 'watchlist' }}
        working-directory: "Vibe-Trading Backtest (Nobitex & Wallex)/nobitex_leveraged"
        continue-on-error: true
        run: |
          mkdir -p out_probe
          python scripts/probe_retention.py BTCIRT "${{ inputs.lookback_days }}" out_probe/retention.json

      - name: ORIGINAL leveraged engine (expected to truncate the window)
        if: ${{ inputs.mode != 'watchlist' }}
        working-directory: "Vibe-Trading Backtest (Nobitex & Wallex)/nobitex_leveraged"
        continue-on-error: true
        run: |
          python scripts/nobitex_leveraged_backtest_ORIGINAL.py \
            --symbols "${{ inputs.symbols }}" \
            --resolution "${{ inputs.resolution }}" \
            --lookback-days "${{ inputs.lookback_days }}" \
            --leverage "${{ inputs.leverage }}" \
            --output-dir out_original

      - name: FIXED leveraged engine (paginated, corrected accounting)
        if: ${{ inputs.mode != 'watchlist' }}
        working-directory: "Vibe-Trading Backtest (Nobitex & Wallex)/nobitex_leveraged"
        run: |
          python scripts/nobitex_leveraged_backtest.py \
            --symbols "${{ inputs.symbols }}" \
            --resolution "${{ inputs.resolution }}" \
            --lookback-days "${{ inputs.lookback_days }}" \
            --leverage "${{ inputs.leverage }}" \
            --output-dir out_fixed

      - name: Compare the two windows
        if: ${{ always() && inputs.mode != 'watchlist' }}
        working-directory: "Vibe-Trading Backtest (Nobitex & Wallex)/nobitex_leveraged"
        run: python scripts/compare_original_vs_fixed.py out_original out_fixed

      - name: Live watchlists — ours vs freqtrade Supertrend
        if: ${{ inputs.mode == 'watchlist' || inputs.mode == 'all' }}
        working-directory: "Vibe-Trading Backtest (Nobitex & Wallex)/nobitex_leveraged"
        run: python scripts/watchlist_compare.py watchlist_out

      - name: Entry / invalidation levels for the surviving symbols
        if: ${{ inputs.mode == 'watchlist' || inputs.mode == 'all' }}
        working-directory: "Vibe-Trading Backtest (Nobitex & Wallex)/nobitex_leveraged"
        run: python scripts/entry_points.py entry_out

      # ── earlier suites, only when explicitly asked for ──
      - name: Vibe-Trading baseline suites
        if: ${{ inputs.mode == 'all' }}
        working-directory: "Vibe-Trading Backtest (Nobitex & Wallex)/local_run_demo"
        run: |
          python run_on_github.py
          python run_five_symbols.py
          python live_watchlist.py

      - name: Upload results (short retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nobitex-backtest-results
          path: |
            Vibe-Trading Backtest (Nobitex & Wallex)/nobitex_leveraged/out_original
            Vibe-Trading Backtest (Nobitex & Wallex)/nobitex_leveraged/out_fixed
            Vibe-Trading Backtest (Nobitex & Wallex)/nobitex_leveraged/out_probe
            Vibe-Trading Backtest (Nobitex & Wallex)/nobitex_leveraged/watchlist_out
            Vibe-Trading Backtest (Nobitex & Wallex)/nobitex_leveraged/entry_out
          retention-days: 1
